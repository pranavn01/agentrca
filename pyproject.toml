[project]
name = "rca"
version = "0.1.0"
description = "Verified failure attribution for multi-stage agent workflows"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.40",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
